name: Refresh market data

on:
  schedule:
    - cron: "7 * * * *" # hourly, a few minutes past the hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - run: node scripts/fetch.mjs
      - name: Commit data if changed
        run: |
          git config user.name "taskmarket-visualizer-bot"
          git config user.email "bot@taskmarket-visualizer.local"
          git add data/
          git diff --cached --quiet || git commit -m "data refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
